spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aparna_jewels}
    username: ${DB_USERNAME:aparna_app}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: aparna-local-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
      max-lifetime: 1800000
      idle-timeout: 600000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    baseline-on-migrate: false